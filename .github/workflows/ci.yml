name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serving.txt
          pip install pytest


      - name: Run tests
        run: |
          pytest -m "not integration"


  build-and-push:

    needs: test

    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/cifar10-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/cifar10-api:${{ github.sha }} \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cifar10-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/cifar10-api:${{ github.sha }}     